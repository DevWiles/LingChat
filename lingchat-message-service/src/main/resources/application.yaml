server:
  port: 8083

spring:
  application:
    name: message-service

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/lingchat?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

# Netty WebSocket 配置
netty:
  websocket:
    port: 8083
    path: /ws

# JWT 配置（用于验证 WebSocket 连接）
jwt:
  secret: bGluZ2NoYXQtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tdmVyeS1sb25nLXN0cmluZw==

logging:
  level:
    org.lingchat.messageservice: debug
    org.hibernate.SQL: debug

spring.data.jpa.repositories.enabled: true
spring.data.redis.repositories.enabled: false
